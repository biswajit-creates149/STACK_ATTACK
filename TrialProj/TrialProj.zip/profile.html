<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    Profile | CampusConnect
  </title>

  <link rel="stylesheet"
        href="css/style.css">

</head>


<body>


<header class="navbar">

  <div class="container nav-inner">

    <a class="brand"
       href="index.html">

      CampusConnect

    </a>


    <button class="menu-btn"
            onclick="toggleMenu()">

      ☰

    </button>


    <nav id="navMenu">

      <a href="index.html">
        Home
      </a>

      <a href="notices.html">
        Notices
      </a>

      <a href="services.html">
        Services
      </a>

      <a href="lost-found.html">
        Lost & Found
      </a>

      <a href="complaints.html">
        Complaints
      </a>

      <a class="active"
         href="profile.html">

        Profile

      </a>

    </nav>

  </div>

</header>



<main class="container section">


  <p class="eyebrow">
    Account
  </p>


  <h1>
    My Profile
  </h1>



  <div class="profile-card">


    <div class="avatar"
         id="avatar">

      S

    </div>


    <div>

      <h2 id="profileName">
        Student
      </h2>

      <p id="profileEmail"
         class="muted">

        Not logged in

      </p>

    </div>


  </div>



  <section class="panel mt">


    <h2>
      Edit Profile
    </h2>


    <form id="profileForm">


      <div class="form-group">

        <label for="profileNameInput">
          Full name
        </label>

        <input
          id="profileNameInput"
          required>

      </div>



      <div class="form-group">

        <label for="profileBranch">
          Branch / Department
        </label>

        <input
          id="profileBranch"
          placeholder="e.g. Artificial Intelligence">

      </div>



      <div class="form-group">

        <label for="profileYear">
          Year
        </label>

        <select id="profileYear">

          <option>
            1st Year
          </option>

          <option>
            2nd Year
          </option>

          <option>
            3rd Year
          </option>

          <option>
            4th Year
          </option>

        </select>

      </div>



      <button
        class="btn"
        type="submit">

        Save Profile

      </button>


    </form>


    <p id="profileMessage"
       class="form-message">
    </p>


  </section>


</main>



<footer class="footer">

  <div class="container">

    <p>
      © 2026 CampusConnect
    </p>

  </div>

</footer>


<script src="js/main.js"></script>

<script src="js/app.js"></script>


</body>
</html>
