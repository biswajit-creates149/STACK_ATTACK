<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Lost & Found | CampusConnect</title>

  <link rel="stylesheet"
        href="css/style.css">

</head>


<body>


<header class="navbar">

  <div class="container nav-inner">

    <a class="brand"
       href="index.html">

      CampusConnect

    </a>


    <button class="menu-btn"
            onclick="toggleMenu()">

      ☰

    </button>


    <nav id="navMenu">

      <a href="index.html">
        Home
      </a>

      <a href="notices.html">
        Notices
      </a>

      <a href="services.html">
        Services
      </a>

      <a class="active"
         href="lost-found.html">

        Lost & Found

      </a>

      <a href="complaints.html">
        Complaints
      </a>

      <a href="dashboard.html">
        Dashboard
      </a>

    </nav>

  </div>

</header>



<main class="container section">


  <div class="section-heading">

    <div>

      <p class="eyebrow">
        Campus community
      </p>

      <h1>
        Lost & Found
      </h1>

      <p class="muted">

        Post an item you lost or found
        on campus.

      </p>

    </div>

  </div>



  <div class="two-column">


    <section class="panel">

      <h2>
        Post an item
      </h2>


      <form id="lostForm">


        <div class="form-group">

          <label for="itemType">
            Type
          </label>

          <select id="itemType" required>

            <option value="Lost">
              I lost something
            </option>

            <option value="Found">
              I found something
            </option>

          </select>

        </div>



        <div class="form-group">

          <label for="itemName">
            Item name
          </label>

          <input
            id="itemName"
            required
            placeholder="e.g. Black wallet">

        </div>



        <div class="form-group">

          <label for="itemLocation">
            Location
          </label>

          <input
            id="itemLocation"
            required
            placeholder="e.g. Library">

        </div>



        <div class="form-group">

          <label for="itemDescription">
            Description
          </label>

          <textarea
            id="itemDescription"
            required
            placeholder="Give useful details">
          </textarea>

        </div>



        <div class="form-group">

          <label for="itemContact">
            Contact
          </label>

          <input
            id="itemContact"
            required
            placeholder="Email or phone">

        </div>



        <button
          class="btn"
          type="submit">

          Post Item

        </button>


      </form>


      <p id="lostMessage"
         class="form-message">
      </p>


    </section>



    <section class="panel">

      <h2>
        Recent Posts
      </h2>

      <div id="lostList"></div>

    </section>


  </div>


</main>



<footer class="footer">

  <div class="container">

    <p>
      © 2026 CampusConnect
    </p>

  </div>

</footer>


<script src="js/main.js"></script>

<script src="js/app.js"></script>


</body>
</html>
