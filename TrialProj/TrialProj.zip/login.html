<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login | CampusConnect</title>

  <link rel="stylesheet"
        href="css/style.css">

</head>


<body>


<header class="navbar">

  <div class="container nav-inner">

    <a class="brand"
       href="index.html">
       CampusConnect
    </a>

    <button class="menu-btn"
            onclick="toggleMenu()">
      ☰
    </button>

    <nav id="navMenu">

      <a href="index.html">Home</a>

      <a href="notices.html">Notices</a>

      <a href="services.html">Services</a>

      <a href="lost-found.html">
        Lost & Found
      </a>

      <a href="complaints.html">
        Complaints
      </a>

      <a href="dashboard.html">
        Dashboard
      </a>

    </nav>

  </div>

</header>



<main class="auth-page">

  <div class="auth-card">

    <h1 id="authTitle">
      Login
    </h1>

    <p class="muted">
      Use the demo account or create a new account.
    </p>


    <form id="authForm">


      <div class="form-group"
           id="nameGroup"
           hidden>

        <label for="name">
          Full name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Your name">

      </div>



      <div class="form-group">

        <label for="email">
          College email
        </label>

        <input
          id="email"
          type="email"
          placeholder="student@college.edu"
          required>

      </div>



      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Minimum 4 characters"
          required
          minlength="4">

      </div>



      <button
        class="btn full"
        type="submit"
        id="authButton">

        Login

      </button>


    </form>


    <p id="authMessage"
       class="form-message">
    </p>


    <button
      class="text-btn"
      id="toggleAuth"
      type="button">

      Don't have an account? Sign up

    </button>


    <p class="demo-note">

      <strong>Demo:</strong>

      you can use any valid email and a
      password of 4+ characters.

    </p>


  </div>

</main>


<script src="js/main.js"></script>

<script src="js/auth.js"></script>


</body>
</html>
